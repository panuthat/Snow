);y.setDate(1);y.setMonth(y.getMonth()+n);const last=new Date(y.getFullYear(),y.getMonth()+1,0).getDate();y.setDate(Math.min(day,last));return y}function run(){let now=only(new Date()),months=(now.getFullYear()-birth.getFullYear())*12+now.getMonth()-birth.getMonth(),a=add(birth,months);if(a>now){months--;a=add(birth,months)}const days=Math.floor((now-a)/MS),total=Math.max(0,Math.round((now-birth)/MS)),nm=months+1,n=add(birth,nm),left=Math.max(0,Math.round((n-now)/MS));document.getElementById('age').textContent=`${months} เดือน ${days} วัน`;document.getElementById('m').textContent=months;document.getElementById('d').textContent=days;document.getElementById('total').textContent=total;document.getElementById('next').textContent=`อีก ${left} วัน Snow จะครบ`;document.getElementById('count').textContent=`${nm} เดือน 🎉`;document.getElementById('date').textContent=n.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})}run()</script></body></html>
